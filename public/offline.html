<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#111111" />
  <title>Offline | Nutri-Trust</title>
  <style>
    /* Self-contained on purpose: this page is served by the service worker
       when the network is down, so it may not load a stylesheet, script or
       font. Colours mirror --background / --foreground in globals.css. */
    :root { --bg: #e9ebf1; --fg: #111111; --muted: #5b5f6b; --btn: #111111; --btn-fg: #ffffff; --ring: #3b53d9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #17171c; --fg: #ededed; --muted: #a2a6b3; --btn: #ffffff; --btn-fg: #000000; --ring: #8fa0ff; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 380px; text-align: center; }
    .mark { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 20px; background: #fff; padding: 8px; }
    .mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
    h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.01em; }
    p { margin: 0 0 24px; font-size: 15px; line-height: 1.55; color: var(--muted); }
    button {
      min-height: 44px; min-width: 160px; padding: 0 22px;
      border: 0; border-radius: 14px; cursor: pointer;
      background: var(--btn); color: var(--btn-fg);
      font: inherit; font-weight: 600;
    }
    button:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark"><img src="/logo.svg" alt="" /></div>
    <h1>You're offline</h1>
    <p>
      Your pantry is stored online, so it can't load without a connection.
      Your saved items are safe &mdash; reconnect and they will be back.
    </p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
