# Local run:
#   cp .env.local.example .env      # then fill in the three values
#   docker compose up --build
# The app is on http://localhost:3000, readiness at /api/health.
#
# Compose reads .env (not .env.local). NEXT_PUBLIC_* are build arguments
# because they are inlined into the browser bundle; GEMINI_API_KEY is passed
# at runtime only and is never part of an image layer.
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL in .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY in .env}
        GIT_SHA: ${GIT_SHA:-local}
    image: nutri-trust:local
    ports:
      - "3000:3000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OFF_USER_ID: ${OFF_USER_ID:-}
      OFF_PASSWORD: ${OFF_PASSWORD:-}
      # The web app falls back to keyword rules if this service is down.
      ML_SERVICE_URL: http://ml:8000
    depends_on:
      ml:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true

  # The trained category model (ml/README.md). Optional at runtime: /api/categorize
  # answers from the keyword rules when this service is unreachable.
  ml:
    build:
      context: .
      dockerfile: ml/service/Dockerfile
    image: nutri-trust-ml:local
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
