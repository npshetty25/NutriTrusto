name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Public, throwaway values. The build bakes NEXT_PUBLIC_* in, and the
      # browser tests fake every request to this host. No real project is named
      # and no secret is used anywhere in this workflow.
      NEXT_PUBLIC_SUPABASE_URL: https://e2e.supabase.test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
      GEMINI_API_KEY: e2e-not-a-real-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # next.config.ts reads the git SHA for the cache name

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit, component, API-route and RLS tests (with coverage)
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            for (const k of ["statements","branches","functions","lines"]) {
              console.log(`- ${k}: ${t[k].pct}% (${t[k].covered}/${t[k].total})`);
            }' >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test
        env:
          E2E_SKIP_BUILD: "1"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 14

  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/service/requirements.txt
      - name: Install pinned dependencies
        run: pip install -r ml/service/requirements.txt pytest httpx
      - name: Service tests (loads the committed model)
        run: python -m pytest ml/service -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://e2e.supabase.test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --build-arg GIT_SHA="${{ github.sha }}" \
            -t nutri-trust:ci .

      - name: Record the image size
        run: |
          bytes=$(docker image inspect nutri-trust:ci --format '{{.Size}}')
          mb=$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1024 / 1024 }')
          echo "### Docker image" >> "$GITHUB_STEP_SUMMARY"
          echo "- size: **${mb} MB** (${bytes} bytes)" >> "$GITHUB_STEP_SUMMARY"
          docker history nutri-trust:ci --no-trunc=false --format '{{.Size}}\t{{.CreatedBy}}' | head -12 >> "$GITHUB_STEP_SUMMARY" || true
          echo "image size: ${mb} MB"

      - name: docker compose up
        run: |
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nGIT_SHA=%s\n' \
            "$NEXT_PUBLIC_SUPABASE_URL" "$NEXT_PUBLIC_SUPABASE_ANON_KEY" "${{ github.sha }}" > .env
          docker compose up -d --build

      - name: Wait for the container and probe it
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "http://localhost:3000/api/health?probe=live" > live.json; then break; fi
            sleep 2
          done
          cat live.json; echo
          test "$(jq -r .status live.json)" = ok

          echo "--- /login"
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:3000/login

          echo "--- readiness (the fake Supabase host is unreachable, so degraded is the expected answer)"
          code=$(curl -s -o ready.json -w "%{http_code}" http://localhost:3000/api/health)
          cat ready.json; echo
          test "$code" = 503
          test "$(jq -r .status ready.json)" = degraded

          echo "--- container facts"
          echo "user id: $(docker compose exec -T web id -u)"
          test "$(docker compose exec -T web id -u)" != 0
          for i in $(seq 1 20); do
            s=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q web)")
            [ "$s" = healthy ] && break
            sleep 3
          done
          echo "docker health status: $s"
          test "$s" = healthy

      - name: Probe the model service
        run: |
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8000/health > ml-health.json && break
            sleep 2
          done
          cat ml-health.json; echo
          test "$(jq -r .model_version ml-health.json)" = category-v1
          curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d "{\"names\": [\"Amul Masala Buttermilk\"]}" | tee ml-predict.json; echo
          test "$(jq -r .predictions[0].category ml-predict.json)" = dairy
          echo "ml image size: $(docker image inspect nutri-trust-ml:local --format "{{.Size}}") bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs
        if: always()
        run: docker compose logs --no-color | tail -60

      - name: Tear down
        if: always()
        run: docker compose down -v
