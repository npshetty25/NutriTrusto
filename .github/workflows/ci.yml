name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Public, throwaway values. The build bakes NEXT_PUBLIC_* in, and the
      # browser tests fake every request to this host. No real project is named
      # and no secret is used anywhere in this workflow.
      NEXT_PUBLIC_SUPABASE_URL: https://e2e.supabase.test
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
      GEMINI_API_KEY: e2e-not-a-real-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # next.config.ts reads the git SHA for the cache name

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit, component, API-route and RLS tests (with coverage)
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            for (const k of ["statements","branches","functions","lines"]) {
              console.log(`- ${k}: ${t[k].pct}% (${t[k].covered}/${t[k].total})`);
            }' >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test
        env:
          E2E_SKIP_BUILD: "1"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 14
